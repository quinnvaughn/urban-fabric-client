<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="56" height="56" rx="4" fill="#ffffff"/>
  <!-- Streets -->
  <rect x="20" y="0" width="16" height="56" fill="#d6d2c8"/>
  <rect x="0" y="20" width="56" height="16" fill="#d6d2c8"/>
  <!-- Intersection box -->
  <rect x="20" y="20" width="16" height="16" fill="#c8c4ba"/>
  <!-- Crosswalk - bottom -->
  <rect x="21" y="38" width="3" height="8" rx="0.5" fill="white"/>
  <rect x="26" y="38" width="3" height="8" rx="0.5" fill="white"/>
  <rect x="31" y="38" width="3" height="8" rx="0.5" fill="white"/>
  <!-- Crosswalk - top -->
  <rect x="21" y="10" width="3" height="8" rx="0.5" fill="white"/>
  <rect x="26" y="10" width="3" height="8" rx="0.5" fill="white"/>
  <rect x="31" y="10" width="3" height="8" rx="0.5" fill="white"/>
  <!-- Crosswalk - left -->
  <rect x="10" y="21" width="8" height="3" rx="0.5" fill="white"/>
  <rect x="10" y="26" width="8" height="3" rx="0.5" fill="white"/>
  <rect x="10" y="31" width="8" height="3" rx="0.5" fill="white"/>
  <!-- Crosswalk - right -->
  <rect x="38" y="21" width="8" height="3" rx="0.5" fill="white"/>
  <rect x="38" y="26" width="8" height="3" rx="0.5" fill="white"/>
  <rect x="38" y="31" width="8" height="3" rx="0.5" fill="white"/>
  <!-- Bike lane (coral) -->
  <rect x="20" y="0" width="4" height="18" fill="#d4735e" opacity="0.75"/>
  <rect x="20" y="38" width="4" height="18" fill="#d4735e" opacity="0.75"/>
  <!-- Trees -->
  <circle cx="13" cy="13" r="6" fill="#1a6b5a"/>
  <circle cx="43" cy="13" r="6" fill="#1a6b5a"/>
  <circle cx="13" cy="43" r="6" fill="#1a6b5a"/>
  <circle cx="43" cy="43" r="6" fill="#1a6b5a"/>
</svg>
