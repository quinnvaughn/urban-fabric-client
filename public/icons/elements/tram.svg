<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <circle cx="16" cy="16" r="15" fill="white" stroke="currentColor" stroke-width="1.5"/>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body: boxy classic streetcar shape -->
    <rect x="4" y="13" width="24" height="9" rx="1" fill="currentColor" fill-opacity="0.1" stroke-width="1.5"/>
    <!-- Cab divider -->
    <line x1="19" y1="13" x2="19" y2="22" stroke-width="1"/>
    <!-- Passenger windows -->
    <rect x="6" y="14.5" width="4" height="4" rx="0.5" stroke-width="1"/>
    <rect x="12" y="14.5" width="4" height="4" rx="0.5" stroke-width="1"/>
    <!-- Cab window -->
    <rect x="21" y="14.5" width="4.5" height="4" rx="0.5" stroke-width="1"/>
    <!-- Wheels -->
    <circle cx="9" cy="23.5" r="2" stroke-width="1.5"/>
    <circle cx="23" cy="23.5" r="2" stroke-width="1.5"/>
    <!-- Scissor pantograph: two arms crossing, contact bar at top -->
    <line x1="13" y1="13" x2="17" y2="9" stroke-width="1"/>
    <line x1="19" y1="13" x2="15" y2="9" stroke-width="1"/>
    <line x1="13.5" y1="9" x2="18.5" y2="9" stroke-width="1.5"/>
  </g>
</svg>
