<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <circle cx="16" cy="16" r="15" fill="white" stroke="currentColor" stroke-width="1.5"/>
  <!-- Lucide P letter (from circle-parking), scaled to fill badge -->
  <!-- P occupies x=9–16, y=7–17 in 24×24 space; scale 1.7, centered at (16,16) -->
  <g transform="translate(-3.25,-4.4) scale(1.7)"
     fill="none" stroke="currentColor"
     stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <path d="M9 17V7h4a3 3 0 0 1 0 6H9"/>
  </g>
  <!-- Strike-through: no parking -->
  <line x1="6" y1="6" x2="26" y2="26"
        stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
</svg>
