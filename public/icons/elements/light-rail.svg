<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <circle cx="16" cy="16" r="15" fill="white" stroke="currentColor" stroke-width="1.5"/>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body: tapered nose on the right, blunt left end -->
    <path d="M5 22 L5 15 Q5 13 7 13 L23 13 Q29 13 28 16 L28 22 Z"
          fill="currentColor" fill-opacity="0.1" stroke-width="1.5"/>
    <!-- Panoramic windows (modern LRT style) -->
    <rect x="7" y="14.5" width="7" height="4" rx="0.5" stroke-width="1"/>
    <rect x="16" y="14.5" width="8" height="4" rx="0.5" stroke-width="1"/>
    <!-- Skirt line: hides bogies, low-floor look -->
    <line x1="5" y1="22" x2="28" y2="22" stroke-width="1"/>
    <!-- Single Z-arm pantograph: stem up from roof, angled arm, contact bar -->
    <line x1="15" y1="13" x2="17" y2="9" stroke-width="1"/>
    <line x1="13" y1="9" x2="19" y2="9" stroke-width="1.5"/>
  </g>
</svg>
