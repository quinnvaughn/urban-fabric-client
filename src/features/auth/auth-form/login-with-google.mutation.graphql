mutation GoogleLogin($input: GoogleLoginInput!) {
	googleLogin(input: $input) {
		... on ConflictError {
			message
		}
		... on UnauthorizedError {
			message
		}
		... on GoogleLoginResponse {
			user {
				...Me
			}
			isNewUser
		}
	}
}

fragment Me on User {
	id
	name
	role
	hasPassword
	email
	authProviders
}
