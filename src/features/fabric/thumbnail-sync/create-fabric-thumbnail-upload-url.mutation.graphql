mutation CreateFabricThumbnailUploadUrl(
	$input: CreateFabricThumbnailUploadUrlInput!
) {
	createFabricThumbnailUploadUrl(input: $input) {
		... on ForbiddenError {
			message
		}
		... on NotFoundError {
			message
		}
		... on UnauthorizedError {
			message
		}
		... on PresignedUploadResult {
			uploadUrl
			publicUrl
		}
	}
}
