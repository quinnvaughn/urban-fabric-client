mutation SyncViewport($input: SyncViewportInput!) {
	syncViewport(input: $input) {
		... on Fabric {
			id
			center {
				lat
				lng
			}
			zoom
			thumbnail
			updatedAt
		}
		... on ForbiddenError {
			message
		}
		... on NotFoundError {
			message
		}
		... on UnauthorizedError {
			message
		}
	}
}
