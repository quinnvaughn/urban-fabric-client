query GetUserProfile($username: String!) {
	user(username: $username) {
		... on NotFoundError {
			message
		}
		... on User {
			...UserProfile
		}
	}
}

fragment UserProfile on User {
	id
	bannerImageUrl
	profilePictureUrl
	bio
	location
	name
	createdAt
	username
	numProposals
	numLikes
	numViews
	isFollowedByMe
	proposals {
		...ProposalCard
	}
	likedProposals {
		...ProposalCard
	}
}
