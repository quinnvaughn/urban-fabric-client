query MyFabrics($limit: Int, $offset: Int, $search: String) {
	myFabrics(limit: $limit, offset: $offset, search: $search) {
		... on MyFabricsPayload {
			total
			hasMore
			fabrics {
				...FabricCard
			}
		}
		... on UnauthorizedError {
			message
		}
	}
}

fragment FabricCard on Fabric {
	id
	center {
		lat
		lng
	}
	zoom
	elements
	proposal {
		id
		isPublished
	}
	locationCity
	locationRegion
	locationRegionAbbr
	thumbnail
	title
	updatedAt
}
