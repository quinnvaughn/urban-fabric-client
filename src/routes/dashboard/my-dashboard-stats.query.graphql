query MyDashboardStats {
	myDashboardStats {
		... on DashboardStats {
			fabricCount
			proposalCount
			proposalLikesDelta
			proposalViewsDelta
			proposalCommentsDelta
			totalProposalLikes
			totalProposalViews
			totalProposalComments
			unpublishedProposalCount
		}
		... on UnauthorizedError {
			message
		}
	}
}
