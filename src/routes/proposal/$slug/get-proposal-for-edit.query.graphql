query GetProposalForEdit($slug: String!) {
	proposalBySlug(slug: $slug) {
		... on NotFoundError {
			message
		}
		... on Proposal {
			id
			fabricId
			isPublished
			title
			description
			categories
			existingConditionPhotos {
				id
				url
				group
				caption
			}
			inspirationPhotos {
				id
				url
				group
				caption
			}
		}
	}
}
