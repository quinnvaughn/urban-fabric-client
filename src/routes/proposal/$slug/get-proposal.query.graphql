query GetProposal($slug: String!) {
	proposalBySlug(slug: $slug) {
		... on NotFoundError {
			message
		}
		... on Proposal {
			id
			fabricId
			isLikedByMe
			description
			publishedAt
			slug
			commentCount
			creator {
				id
				name
				username
				profilePictureUrl
				isFollowedByMe
			}
			categories
			likeCount
			snapshotCenter {
				lat
				lng
			}
			snapshotElements
			snapshotLocationCity
			snapshotLocationRegion
			snapshotLocationRegionAbbr
			snapshotMapStyle
			snapshotThumbnail
			snapshotZoom
			title
			viewCount
		}
	}
}
