query GetFabric($fabricId: ID!) {
	fabric(id: $fabricId) {
		... on Fabric {
			id
			title
			creator {
				id
			}
			center {
				lng
				lat
			}
			zoom
			elements
			thumbnail
			mapStyle
			isIn3DMode
			locationCity
			locationRegion
			locationRegionAbbr
			proposal {
				id
				slug
			}
		}
		... on NotFoundError {
			message
		}
		... on UnauthorizedError {
			message
		}
		... on ForbiddenError {
			message
		}
	}
}
