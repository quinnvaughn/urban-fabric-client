query GetFabric($fabricId: ID!) {
	fabric(id: $fabricId) {
		... on Fabric {
			id
			title
			center {
				lng
				lat
			}
			zoom
			elements
			thumbnail
			mapStyle
			locationCity
			locationRegion
			locationRegionAbbr
			proposal {
				id
				slug
			}
		}
		... on NotFoundError {
			message
		}
	}
}
